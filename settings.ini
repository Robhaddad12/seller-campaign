# =====================================================================
#  SETTINGS FOR THE DAILY LEAD UPLOAD
#  This is the only file you should need to edit.
#  Lines starting with # are notes and are ignored.
#  Your Smartlead API key does NOT go here. It goes in the .env file.
# =====================================================================

[smartlead]
# The Smartlead campaign the leads go into.
# Find the number in the web address when you open the campaign in
# Smartlead, e.g.  app.smartlead.ai/app/email-campaign/1234567/...
campaign_id = PUT_CAMPAIGN_NUMBER_HERE


[folders]
# Where you save the Vulcan7 export each day.
# "vulcan7-inbox" means the folder of that name inside this project.
# You can also give a full path, e.g. ~/Documents/Vulcan7 Inbox
inbox_folder = vulcan7-inbox


[choices]
# Owners with several email addresses:
#   first = use only the first good email (fewer bounces, protects
#           your warmed-up inboxes)  <-- recommended
#   all   = send to every good email for that owner
emails_per_owner = first

# Owners that are companies or trusts (LLC, Inc, Trust, Estate...):
#   keep = keep them, and use the word below as their first name
#   skip = leave them out
companies_and_trusts = keep
company_first_name = Homeowner


[columns]
# Which column in the Vulcan7 file holds each piece of information.
# Left side: what this program calls it (do not change).
# Right side: the column heading in your Vulcan7 file.
# If Vulcan7 might use different headings, list them separated by |
# and the first one found in the file is used.
# Upper/lower case and extra spaces don't matter.

# Owner name. Use EITHER first_name + last_name, OR full_name, or both
# (separate columns win when they have something in them).
first_name = First Name | Owner First Name | First
last_name  = Last Name | Owner Last Name | Last
full_name  = Owner Name | Owner | Name | Owner 1 | Full Name

# How names are written in the full-name column:
#   first_last  = "John Smith"
#   last_first  = "Smith John"
#   (A comma, like "Smith, John", is always read as last, first.)
full_name_order = first_last

# Email columns, in order of preference (first = best).
email_columns = Email | Email 1 | Email1 | Email 2 | Email2 | Email 3 | Email3 | Email 4 | Email4 | Email 5 | Email5

# The canceled listing's property address (not the owner's mailing address).
property_address = Property Address | Address | Street Address | Site Address
city  = Property City | City
state = Property State | State
zip   = Property Zip | Zip | Zip Code | Postal Code
